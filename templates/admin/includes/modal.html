{# v1.5 — confirm modal. Starts hidden; global.css forces [hidden] to win. #}
<div class="modal-backdrop" id="confirmModal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <h3 id="modalTitle">Please confirm</h3>
    <p id="modalText">Are you sure?</p>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" data-modal-close>✖ Cancel</button>
      <button type="button" class="btn btn-danger" id="modalConfirm" data-label="Delete">🗑 Delete</button>
    </div>
  </div>
</div>
